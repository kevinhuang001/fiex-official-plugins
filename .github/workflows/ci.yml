name: Build and test optional Fiex plugins
on:
  push:
    branches: [main]
    tags: ["plugins-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: "10G"
  CARGO_INCREMENTAL: "0"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  format:
    name: Format all Rust plugins and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check all crates before long platform builds
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for slug in ssh git webdav gdrive smb openlist office-preview data-preview archive checksum everything gpg email; do
            cargo fmt --manifest-path "official/$slug/Cargo.toml" --check || status=1
          done
          cargo fmt --manifest-path example/hello/Cargo.toml --check || status=1
          python -m py_compile scripts/package-fiex-plugin.py scripts/test-plugin-process.py scripts/test-live-remotes.py scripts/test-git-vfs.py scripts/test-ssh-plugin.py || status=1
          exit "$status"

  ui:
    name: Standalone plugin panels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            official/*/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-i18n.txt
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run test:i18n
      - name: Typecheck and rebuild self-contained panels
        run: |
          set -euo pipefail
          for slug in git archive gpg email ssh; do
            npm --prefix "official/$slug/ui" ci
            npm --prefix "official/$slug/ui" run build
          done
          npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panels
          path: official/*/ui/dist

  build-linux:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        shard: [office, data, services]
    uses: ./.github/workflows/native-plugins.yml
    with:
      runner: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      platform: linux-x86_64
      shard: ${{ matrix.shard }}

  package-linux:
    needs: [build-linux, ui]
    uses: ./.github/workflows/package-plugins.yml
    with:
      target: x86_64-unknown-linux-gnu

  build-windows:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        shard: [office, data, services]
    uses: ./.github/workflows/native-plugins.yml
    with:
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      platform: windows-x86_64
      shard: ${{ matrix.shard }}

  package-windows:
    needs: [build-windows, ui]
    uses: ./.github/workflows/package-plugins.yml
    with:
      target: x86_64-pc-windows-msvc

  build-macos:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        shard: [office, data, services]
    uses: ./.github/workflows/native-plugins.yml
    with:
      runner: macos-latest
      target: aarch64-apple-darwin
      platform: macos-aarch64
      shard: ${{ matrix.shard }}

  package-macos:
    needs: [build-macos, ui]
    uses: ./.github/workflows/package-plugins.yml
    with:
      target: aarch64-apple-darwin

  core-integration:
    name: Installed official plugins ↔ real Core host (Linux)
    needs: package-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: kevinhuang001/fiex
          ref: refactor/unified-fs-broker
          path: core
      - name: Checkout Core's pinned SDK
        run: git -C core submodule update --init sdk
      - uses: actions/download-artifact@v4
        with:
          name: fiex-plugins-x86_64-unknown-linux-gnu
          path: packages
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable compiler cache
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: linux-host-integration
          cache-all-crates: true
      - name: Spawn each packaged plugin through the real Core host
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-official-plugin-tests/user-data
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-official-plugin-tests/plugins
        run: |
          set -euo pipefail
          mkdir -p "$FIEX_PLUGIN_DIR"
          python scripts/install-test-packages.py --packages packages --destination "$FIEX_PLUGIN_DIR" --platform linux-x86_64
          for id in org.fiex.ssh org.fiex.git org.fiex.webdav org.fiex.gdrive org.fiex.smb org.fiex.openlist org.fiex.office-preview org.fiex.data-preview org.fiex.archive org.fiex.checksum org.fiex.gpg org.fiex.email; do
            cargo run --locked --manifest-path core/src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_smoke -- "$id"
          done
          # Every declared panel must resolve through the real host, including
          # the advanced-compression panel nested in a context submenu.
          cargo run --locked --manifest-path core/src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_panels -- org.fiex.archive org.fiex.gpg org.fiex.git
          cargo run --manifest-path integration/Cargo.toml --example plugin_connection_view_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_git_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_optional_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_info_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_preview_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_decorations_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_gpg_e2e
      - name: SSH plugin against a real local sshd
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-official-plugin-tests/user-data
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-official-plugin-tests/plugins
        run: |
          set -euo pipefail
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd /root/.ssh
          key="$RUNNER_TEMP/fiex-ssh-test-key"
          ssh-keygen -t ed25519 -N "" -f "$key" >/dev/null
          sudo cp "$key.pub" /root/.ssh/authorized_keys
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo /usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1 \
            -o PermitRootLogin=prohibit-password -o PasswordAuthentication=no \
            -o UsePAM=no -o PidFile=/tmp/fiex-sshd.pid
          trap 'sudo kill "$(sudo cat /tmp/fiex-sshd.pid)" 2>/dev/null || true' EXIT
          mkdir -p "$RUNNER_TEMP/fiex-ssh-home"
          binary="$(find "$FIEX_PLUGIN_DIR" -type f -name fiex-plugin-ssh | head -1)"
          HOME="$RUNNER_TEMP/fiex-ssh-home" python3 scripts/test-ssh-plugin.py \
            --binary "$binary" --host 127.0.0.1 --port 2222 --user root --identity "$key"

      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: |
          sccache --show-stats
          {
            echo '### sccache'
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  remote-integration:
    name: Real WebDAV and SMB plugin integration (Linux)
    needs: package-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: kevinhuang001/fiex
          ref: refactor/unified-fs-broker
          path: core
      - name: Checkout Core SDK
        run: git -C core submodule update --init sdk
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable compiler cache
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: linux-host-integration
          cache-all-crates: true
      - uses: actions/download-artifact@v4
        with:
          name: fiex-plugins-x86_64-unknown-linux-gnu
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated WebDAV fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q wsgidav cheroot
          mkdir -p .ci/webdav
          printf 'hello webdav\n' > .ci/webdav/hello.txt
          printf 'another webdav\n' > .ci/webdav/another.txt
          python -c 'from wsgidav.server.server_cli import run; run()' --host=127.0.0.1 --port=8080 --root="$PWD/.ci/webdav" --auth=anonymous > .ci/webdav.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat .ci/webdav.log
          exit 1
      - name: Prepare isolated SMB fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba smbclient
          sudo useradd -M -s /usr/sbin/nologin fiex 2>/dev/null || true
          mkdir -p .ci/smb /tmp/fiex-ci-smb
          printf 'hello smb\n' > /tmp/fiex-ci-smb/hello.txt
          printf 'another smb\n' > /tmp/fiex-ci-smb/another.txt
          chmod 755 /tmp/fiex-ci-smb
          sudo chown -R fiex:fiex /tmp/fiex-ci-smb
          printf 'FiexCI-Test-Only-2026\nFiexCI-Test-Only-2026\n' | sudo smbpasswd -a fiex -s
          cat > .ci/smb.conf <<EOF
          [global]
            workgroup = WORKGROUP
            server role = standalone server
            security = user
            map to guest = Bad User
            server min protocol = SMB2
            smb ports = 445
          [fiex]
            path = /tmp/fiex-ci-smb
            browseable = yes
            read only = no
            guest ok = no
            valid users = fiex
            force user = fiex
          EOF
          sudo systemctl stop smbd 2>/dev/null || true
          sudo testparm -s "$PWD/.ci/smb.conf"
          sudo smbd -s "$PWD/.ci/smb.conf" -F --debug-stdout --debuglevel=2 > .ci/smb.log 2>&1 &
          for i in $(seq 1 30); do
            if smbclient //127.0.0.1/fiex -U 'fiex%FiexCI-Test-Only-2026' -c ls > /dev/null 2>&1; then exit 0; fi
            if ! sudo pgrep -x smbd > /dev/null; then
              echo "smbd exited before serving test requests"
              cat .ci/smb.log
              exit 1
            fi
            sleep 1
          done
          cat .ci/smb.log
          sudo ss -lntp || true
          exit 1
      - name: Test released plugin processes against both servers
        shell: bash
        env:
          FIEX_TEST_SMB_PASSWORD: FiexCI-Test-Only-2026
        run: |
          timeout 240s python scripts/test-live-remotes.py --packages packages
      - name: Real Core sandbox and resource broker against both servers
        shell: bash
        env:
          FIEX_TEST_SMB_PASSWORD: FiexCI-Test-Only-2026
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-network-broker/plugins
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-network-broker/data
        run: |
          set -euo pipefail
          mkdir -p "$FIEX_PLUGIN_DIR"
          python scripts/install-test-packages.py --packages packages --destination "$FIEX_PLUGIN_DIR" --platform linux-x86_64 --slugs webdav smb
          cargo run --manifest-path integration/Cargo.toml --example plugin_network_e2e

      - name: Remote fixture diagnostics
        if: failure()
        run: |
          cat .ci/webdav.log 2>/dev/null || true
          cat .ci/smb.log 2>/dev/null || true
      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: |
          sccache --show-stats
          {
            echo '### sccache'
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/plugins-v'))
    needs:
      [
        package-linux,
        package-windows,
        package-macos,
        core-integration,
        remote-integration,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fiex-plugins-*
          path: dist/plugins
          merge-multiple: true
      - name: Select release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="plugins-v$(cat plugin-release-version.txt)"
          fi
          echo "FIEX_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Filter catalog to artifacts built by this release
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("dist/plugins")
          files = {path.name for path in root.glob("*.fiexplugin")}
          target = root / "fiex-catalog.json"
          catalog = json.loads(target.read_text(encoding="utf-8"))
          for plugin in catalog["plugins"]:
              plugin["assets"] = {
                  platform: name
                  for platform, name in plugin["assets"].items()
                  if name in files
              }
          target.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Sign plugin packages and catalog
        env:
          FIEX_SIGNING_KEY: ${{ secrets.FIEX_SIGNING_KEY }}
        run: |
          test -n "$FIEX_SIGNING_KEY"
          printf '%s' "$FIEX_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/fiex-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/fiex-signing-key.pem"
          python -m pip install --quiet cryptography
          python scripts/sign-plugin-package.py dist/plugins/*.fiexplugin \
            --key "$RUNNER_TEMP/fiex-signing-key.pem"
          rm -f "$RUNNER_TEMP/fiex-signing-key.pem"
      - name: Publish optional GitHub plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$FIEX_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$FIEX_RELEASE_TAG is already published; do not overwrite packages."
            exit 0
          fi
          gh release create "$FIEX_RELEASE_TAG" dist/plugins/*.fiexplugin dist/plugins/fiex-catalog.json dist/plugins/plugin-descriptions.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$FIEX_RELEASE_TAG" --notes-file RELEASE.md
