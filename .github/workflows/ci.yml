name: Build and test optional Fiex plugins
on:
  push:
    branches: [main]
    tags: ["plugins-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    name: Standalone plugin panels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck and rebuild self-contained panels
        run: |
          set -euo pipefail
          for slug in git archive checksum gpg; do
            npm --prefix "official/$slug/ui" ci
            npm --prefix "official/$slug/ui" run build
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panels
          path: official/*/ui/dist

  build:
    needs: ui
    name: Plugin build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: plugin-panels
          path: official
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: official/git -> ../../target
          key: official-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plugin unit tests and cross-platform packages
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          python -m py_compile scripts/package-fiex-plugin.py scripts/test-plugin-process.py scripts/test-live-remotes.py
          for slug in git webdav smb openlist office-preview data-preview archive checksum everything gpg; do
            cargo fmt --manifest-path "official/$slug/Cargo.toml" --check
            cargo test --manifest-path "official/$slug/Cargo.toml" --target "${{ matrix.target }}"
            cargo clippy --manifest-path "official/$slug/Cargo.toml" --target "${{ matrix.target }}" --all-targets -- -D warnings
            cargo build --release --manifest-path "official/$slug/Cargo.toml" --target "${{ matrix.target }}"
            python scripts/package-fiex-plugin.py --slug "$slug" --target "${{ matrix.target }}"
          done
          for slug in vista win11; do python scripts/package-fiex-plugin.py --slug "$slug" --target "${{ matrix.target }}"; done
          python scripts/generate-catalog.py
      - name: Real process handshake, ping, errors and shutdown
        shell: bash
        run: |
          python scripts/test-plugin-process.py --target "${{ matrix.platform }}" --binary-root "target/${{ matrix.target }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: fiex-plugins-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/plugins/*.fiexplugin
            dist/plugins/fiex-catalog.json
            dist/plugins/plugin-descriptions.json
  core-integration:
    name: Installed official plugins ↔ real Core host (Linux)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: kevinhuang001/fiex
          ref: 06a7216ef5bf659f53bbf5a9913f2b1cf1f02889
          path: core
      - name: Checkout Core's pinned SDK
        run: git -C core submodule update --init sdk
      - uses: actions/download-artifact@v4
        with:
          name: fiex-plugins-x86_64-unknown-linux-gnu
          path: packages
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/src-tauri -> target
          key: core-host-integration
      - name: Spawn each packaged plugin through the real Core host
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-official-plugin-tests/user-data
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-official-plugin-tests/plugins
        run: |
          set -euo pipefail
          mkdir -p "$FIEX_PLUGIN_DIR"
          python -c 'import pathlib,zipfile,os; root=pathlib.Path(os.environ["FIEX_PLUGIN_DIR"]); packages=sorted(pathlib.Path("packages").glob("*.fiexplugin")); assert len(packages)==11; [(zipfile.ZipFile(p).extractall(root/p.stem)) for p in packages]; [(f.chmod(0o755)) for f in root.rglob("fiex-plugin-*") if f.is_file()]'
          for id in org.fiex.git org.fiex.webdav org.fiex.smb org.fiex.openlist org.fiex.office-preview org.fiex.data-preview org.fiex.archive org.fiex.checksum org.fiex.gpg; do
            cargo run --locked --manifest-path core/src-tauri/Cargo.toml --no-default-features --example plugin_smoke -- "$id"
          done
          # Every declared panel must resolve through the real host, including
          # the advanced-compression panel nested in a context submenu.
          cargo run --locked --manifest-path core/src-tauri/Cargo.toml --no-default-features --example plugin_panels -- org.fiex.archive org.fiex.gpg org.fiex.git
          cargo run --manifest-path integration/Cargo.toml --example plugin_git_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_optional_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_info_e2e
          cargo run --manifest-path integration/Cargo.toml --example plugin_gpg_e2e
  remote-integration:
    name: Real WebDAV and SMB plugin integration (Linux)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: kevinhuang001/fiex
          ref: 06a7216ef5bf659f53bbf5a9913f2b1cf1f02889
          path: core
      - name: Checkout Core SDK
        run: git -C core submodule update --init sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integration -> target
          key: real-network-broker
      - uses: actions/download-artifact@v4
        with:
          name: fiex-plugins-x86_64-unknown-linux-gnu
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated WebDAV fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q wsgidav cheroot
          mkdir -p .ci/webdav
          printf 'hello webdav\n' > .ci/webdav/hello.txt
          printf 'another webdav\n' > .ci/webdav/another.txt
          python -c 'from wsgidav.server.server_cli import run; run()' --host=127.0.0.1 --port=8080 --root="$PWD/.ci/webdav" --auth=anonymous > .ci/webdav.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat .ci/webdav.log
          exit 1
      - name: Prepare isolated SMB fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba smbclient
          sudo useradd -M -s /usr/sbin/nologin fiex 2>/dev/null || true
          mkdir -p .ci/smb /tmp/fiex-ci-smb
          printf 'hello smb\n' > /tmp/fiex-ci-smb/hello.txt
          printf 'another smb\n' > /tmp/fiex-ci-smb/another.txt
          chmod 755 /tmp/fiex-ci-smb
          printf 'FiexCI-Test-Only-2026\nFiexCI-Test-Only-2026\n' | sudo smbpasswd -a fiex -s
          cat > .ci/smb.conf <<EOF
          [global]
            workgroup = WORKGROUP
            server role = standalone server
            security = user
            map to guest = Bad User
            server min protocol = SMB2
            smb ports = 445
          [fiex]
            path = /tmp/fiex-ci-smb
            browseable = yes
            read only = no
            guest ok = no
            valid users = fiex
            force user = fiex
          EOF
          sudo systemctl stop smbd 2>/dev/null || true
          sudo testparm -s "$PWD/.ci/smb.conf"
          sudo smbd -s "$PWD/.ci/smb.conf" -F --debug-stdout --debuglevel=2 > .ci/smb.log 2>&1 &
          for i in $(seq 1 30); do
            if smbclient //127.0.0.1/fiex -U 'fiex%FiexCI-Test-Only-2026' -c ls > /dev/null 2>&1; then exit 0; fi
            if ! sudo pgrep -x smbd > /dev/null; then
              echo "smbd exited before serving test requests"
              cat .ci/smb.log
              exit 1
            fi
            sleep 1
          done
          cat .ci/smb.log
          sudo ss -lntp || true
          exit 1
      - name: Test released plugin processes against both servers
        shell: bash
        env:
          FIEX_TEST_SMB_PASSWORD: FiexCI-Test-Only-2026
        run: |
          timeout 240s python scripts/test-live-remotes.py --packages packages
      - name: Real Core sandbox and resource broker against both servers
        shell: bash
        env:
          FIEX_TEST_SMB_PASSWORD: FiexCI-Test-Only-2026
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-network-broker/plugins
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-network-broker/data
        run: |
          set -euo pipefail
          mkdir -p "$FIEX_PLUGIN_DIR"
          python -c 'import pathlib,zipfile,os; root=pathlib.Path(os.environ["FIEX_PLUGIN_DIR"]); packages=[p for p in pathlib.Path("packages").glob("*.fiexplugin") if p.name.startswith(("webdav-", "smb-"))]; assert len(packages)==2; [(zipfile.ZipFile(p).extractall(root/p.stem)) for p in packages]; [(f.chmod(0o755)) for f in root.rglob("fiex-plugin-*") if f.is_file()]'
          cargo run --manifest-path integration/Cargo.toml --example plugin_network_e2e

      - name: Remote fixture diagnostics
        if: failure()
        run: |
          cat .ci/webdav.log 2>/dev/null || true
          cat .ci/smb.log 2>/dev/null || true
  release:
    if: startsWith(github.ref, 'refs/tags/plugins-v')
    needs: [build, core-integration, remote-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fiex-plugins-*
          path: dist/plugins
          merge-multiple: true
      - name: Filter catalog to artifacts built by this release
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("dist/plugins")
          files = {path.name for path in root.glob("*.fiexplugin")}
          target = root / "fiex-catalog.json"
          catalog = json.loads(target.read_text(encoding="utf-8"))
          for plugin in catalog["plugins"]:
              plugin["assets"] = {
                  platform: name
                  for platform, name in plugin["assets"].items()
                  if name in files
              }
          target.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Sign plugin packages and catalog
        env:
          FIEX_SIGNING_KEY: ${{ secrets.FIEX_SIGNING_KEY }}
        run: |
          test -n "$FIEX_SIGNING_KEY"
          printf '%s' "$FIEX_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/fiex-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/fiex-signing-key.pem"
          python -m pip install --quiet cryptography
          python scripts/sign-plugin-package.py dist/plugins/*.fiexplugin \
            --key "$RUNNER_TEMP/fiex-signing-key.pem"
          rm -f "$RUNNER_TEMP/fiex-signing-key.pem"
      - name: Publish optional GitHub plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/plugins/*.fiexplugin dist/plugins/fiex-catalog.json dist/plugins/plugin-descriptions.json --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "Optional Fiex plugins; installation and permission approval are required."
