<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例插件</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d2430; --muted: #6b7684; --surface: #fff; --canvas: #f6f7f9;
        --line: rgba(20, 30, 45, 0.12); --accent: #2f6fed;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 18px; color: var(--text); background: var(--surface);
        font: 12px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      h2 { margin: 0 0 4px; font-size: 14px; }
      p { margin: 0 0 12px; color: var(--muted); }
      .card {
        padding: 12px; border: 1px solid var(--line); border-radius: 10px;
        background: var(--canvas); margin-bottom: 12px;
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      button {
        border: 1px solid var(--accent); border-radius: 7px; background: transparent;
        color: var(--accent); padding: 5px 12px; font: inherit; cursor: pointer;
      }
      button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
      #result { margin-top: 10px; color: var(--muted); white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h2>工具栏面板示例</h2>
    <p>这是插件自己的内容区。标题栏由 Core 提供，页面里不要再画一个标题栏。</p>
    <div class="card">
      <div>当前目录：<code id="directory">读取中…</code></div>
      <div style="margin-top: 6px">选中项：<code id="selection">—</code></div>
    </div>
    <button id="greet" type="button">调用 native 命令</button>
    <div id="result"></div>
    <script>
      (() => {
        let port = null, sessionId = '', nonce = '', seq = 0
        const pending = new Map()
        const setToken = (tokens) => {
          for (const [key, value] of Object.entries(tokens || {})) {
            if (key === 'mode' || !value) continue
            document.documentElement.style.setProperty(`--${key}`, value)
          }
        }
        const invoke = (method, params) =>
          new Promise((resolve, reject) => {
            if (!port) return reject(new Error('bridge not ready'))
            const requestId = `example-${++seq}`
            const timer = setTimeout(() => { pending.delete(requestId); reject(new Error('请求超时')) }, 10000)
            pending.set(requestId, { resolve, reject, timer })
            port.postMessage({ type: 'request', bridgeVersion: '1.0', sessionId, requestId, method, params })
          })
        const start = async () => {
          try {
            setToken((await invoke('theme.get')).tokens)
            const context = await invoke('context.get')
            document.getElementById('directory').textContent = context.directoryPath || '—'
            const selected = context.selectionPaths || []
            document.getElementById('selection').textContent =
              selected.length ? selected.join(', ') : '—'
          } catch (error) {
            document.getElementById('result').textContent = String(error?.message || error)
          }
        }
        document.getElementById('greet').addEventListener('click', async () => {
          try {
            const value = await invoke('plugin.invoke', {
              method: 'example.greet',
              params: {}
            })
            document.getElementById('result').textContent = value.message || JSON.stringify(value)
          } catch (error) {
            document.getElementById('result').textContent = String(error?.message || error)
          }
        })
        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return
          const data = event.data
          if (!data || data.type !== 'fiex.bridge.init' || event.ports.length !== 1) return
          port = event.ports[0]
          sessionId = data.sessionId
          nonce = data.nonce
          port.onmessage = (message) => {
            const payload = message.data
            if (payload?.type === 'response' && payload.requestId) {
              const entry = pending.get(payload.requestId)
              if (!entry) return
              pending.delete(payload.requestId)
              clearTimeout(entry.timer)
              if (payload.error) entry.reject(new Error(payload.error.message || '请求失败'))
              else entry.resolve(payload.result)
              return
            }
            if (payload?.type === 'event' && payload.name === 'theme.changed')
              setToken(payload.payload?.tokens)
          }
          port.start()
          port.postMessage({ type: 'fiex.bridge.ready', sessionId, nonce, bridgeVersion: '1.0' })
          start()
        })
        window.parent.postMessage({ type: 'fiex.bridge.listening' }, '*')
      })()
    </script>
  </body>
</html>
