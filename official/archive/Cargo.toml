[package]
name="fiex-plugin-archive"
version = "0.3.6"
edition="2021"
rust-version="1.90"
[dependencies]
fiex-plugin-sdk={path="../../sdk/rust"}
serde_json="1"
globset="0.4"
zip={version="4",default-features=false,features=["deflate","bzip2","zstd","aes-crypto"]}
tar="0.4"
flate2="1"
bzip2="0.6"
xz2={version="0.1",features=["static"]}
sevenz-rust2="0.20"
rars={version="0.11",default-features=false,features=["parallel","encryption","write"]}
tempfile="3"
