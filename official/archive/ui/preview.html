<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>压缩包预览</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d2430; --muted: #6b7684; --surface: #fff; --canvas: #f6f7f9;
        --line: rgba(20, 30, 45, 0.12); --accent: #2f6fed; --danger: #b4443d;
        font: 12px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: flex; flex-direction: column; background: var(--surface); color: var(--text); }
      .actions {
        display: flex; align-items: center; gap: 10px; padding: 8px 14px;
        border-top: 1px solid var(--line); min-height: 40px;
      }
      .actions .spacer { flex: 1; }
      button {
        border: 1px solid var(--line); background: var(--surface); color: var(--text);
        border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer;
      }
      button.primary { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .password { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
      .password input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; background: var(--surface); color: var(--text); }
      .password[hidden] { display: none; }
      main { flex: 1; overflow: auto; min-height: 0; padding: 6px 0 8px; }
      .listing { display: flex; flex-direction: column; gap: 1px; }
      .entry {
        display: flex; align-items: center; gap: 8px;
        height: 34px; padding: 0 12px; margin: 0 8px; border-radius: 7px;
        cursor: default; outline: none;
      }
      .entry:hover, .entry:focus-visible { background: var(--canvas); }
      .entry.dir { cursor: pointer; }
      .entry.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .entry-icon { flex: 0 0 18px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
      .entry-icon svg { width: 17px; height: 17px; display: block; }
      .folder-icon { color: #e0a33a; }
      .file-icon { color: var(--muted); }
      .entry-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .entry-name.dir { color: var(--accent); font-weight: 500; }
      .entry-kind { flex: 0 0 92px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .entry-size { flex: 0 0 76px; text-align: right; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .entry-chevron { flex: 0 0 14px; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
      .entry-chevron svg { width: 13px; height: 13px; transition: transform 120ms ease; }
      .entry-chevron.open svg { transform: rotate(90deg); }
      .entry-chevron.empty { visibility: hidden; }
      .empty { padding: 42px 18px; text-align: center; color: var(--muted); }
      .hint, .error { padding: 18px; text-align: center; color: var(--muted); }
      .error { color: var(--danger); white-space: pre-wrap; }
      .status { padding: 6px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="password" id="password-row" hidden>
      <input id="password" type="password" placeholder="压缩包密码" aria-label="压缩包密码" />
      <button id="unlock" type="button">解锁</button>
    </div>
    <main id="content"><p class="hint">正在读取…</p></main>
    <div class="status" id="status" hidden></div>
    <div class="actions">
      <span id="summary" style="color: var(--muted)"></span>
      <span class="spacer"></span>
      <button id="extract" class="primary" type="button" disabled>解压到当前目录</button>
    </div>
    <script>
      (() => {
        const content = document.getElementById('content')
        const summary = document.getElementById('summary')
        const passwordRow = document.getElementById('password-row')
        const password = document.getElementById('password')
        const unlock = document.getElementById('unlock')
        const extract = document.getElementById('extract')
        const status = document.getElementById('status')
        let port = null, sessionId = '', nonce = '', seq = 0, path = '', passwordValue = ''
        let requestTimeoutMs = 20000
        let allEntries = []
        const expanded = new Set()
        const pending = new Map()

        const setToken = (tokens) => {
          for (const [key, value] of Object.entries(tokens || {})) {
            if (key === 'mode' || !value) continue
            document.documentElement.style.setProperty(`--${key}`, value)
          }
        }
        const invoke = (method, params) =>
          new Promise((resolve, reject) => {
            if (!port) return reject(new Error('bridge not ready'))
            const requestId = `archive-${++seq}`
            const timer = setTimeout(() => { pending.delete(requestId); reject(new Error('请求超时')) }, requestTimeoutMs)
            pending.set(requestId, { resolve, reject, timer })
            port.postMessage({ type: 'request', bridgeVersion: '1.0', sessionId, requestId, method, params })
          })
        const fail = (error) => { content.innerHTML = ''; const p = document.createElement('p'); p.className = 'error'; p.textContent = String(error?.message || error); content.append(p) }
        const human = (size) => size < 1024 ? `${size} B` : size < 1048576 ? `${(size / 1024).toFixed(1)} KB` : `${(size / 1048576).toFixed(1)} MB`
        const setStatus = (text) => { status.hidden = !text; status.textContent = text }

        const clean = (name) => String(name || '').replace(/\\/g, '/').replace(/^\.?\//, '').replace(/\/+$/, '')

        const childrenFor = (directory) => {
          const prefix = directory ? `${directory}/` : ''
          const values = new Map()
          for (const entry of allEntries) {
            const full = clean(entry.name)
            if (!full || (prefix && !full.startsWith(prefix))) continue
            const rest = prefix ? full.slice(prefix.length) : full
            if (!rest) continue
            const parts = rest.split('/')
            const head = parts[0]
            if (!head || head === '.' || head === '..') continue
            const nested = parts.length > 1 || Boolean(entry.isDir)
            const path = prefix + head
            const value = values.get(head) || { name: head, path, isDir: false, size: 0 }
            if (nested) value.isDir = true
            else { value.isDir = false; value.size = Number(entry.size) || 0 }
            values.set(head, value)
          }
          return [...values.values()].sort((a, b) => {
            if (a.isDir !== b.isDir) return a.isDir ? -1 : 1
            return a.name.localeCompare(b.name)
          })
        }

        const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>'

        const render = () => {
          content.innerHTML = ''
          const folder = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>'
          const file = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h5"/></svg>'
          const listing = document.createElement('div')
          listing.className = 'listing'
          listing.setAttribute('role', 'tree')
          let painted = 0

          const append = (directory, depth) => {
            for (const entry of childrenFor(directory)) {
              painted += 1
              const row = document.createElement('div')
              row.className = 'entry' + (entry.isDir ? ' dir' : '')
              row.setAttribute('role', 'treeitem')
              row.tabIndex = 0
              row.style.paddingLeft = `${12 + depth * 18}px`
              const marker = document.createElement('span')
              marker.className = 'entry-chevron' + (entry.isDir ? (expanded.has(entry.path) ? ' open' : '') : ' empty')
              marker.innerHTML = chevron
              const icon = document.createElement('span')
              icon.className = 'entry-icon ' + (entry.isDir ? 'folder-icon' : 'file-icon')
              icon.innerHTML = entry.isDir ? folder : file
              const name = document.createElement('span')
              name.className = 'entry-name' + (entry.isDir ? ' dir' : '')
              name.textContent = entry.name
              name.title = entry.path
              const kind = document.createElement('span')
              kind.className = 'entry-kind'
              const ext = entry.name.includes('.') ? entry.name.split('.').pop().toUpperCase() : ''
              kind.textContent = entry.isDir ? '文件夹' : ext ? `${ext} 文件` : '文件'
              const size = document.createElement('span')
              size.className = 'entry-size'
              size.textContent = entry.isDir ? '—' : human(entry.size || 0)
              row.append(marker, icon, name, kind, size)
              if (entry.isDir) {
                const open = expanded.has(entry.path)
                row.setAttribute('aria-expanded', open ? 'true' : 'false')
                const toggle = () => {
                  if (expanded.has(entry.path)) expanded.delete(entry.path)
                  else expanded.add(entry.path)
                  render()
                }
                row.addEventListener('click', toggle)
                row.addEventListener('keydown', (event) => {
                  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle() }
                })
              }
              listing.append(row)
              if (entry.isDir && expanded.has(entry.path)) append(entry.path, depth + 1)
            }
          }

          append('', 0)
          if (!painted) {
            const empty = document.createElement('div')
            empty.className = 'empty'
            empty.textContent = '压缩包是空的'
            content.append(empty)
            return
          }
          content.append(listing)
        }

        const load = async () => {
          setStatus('')
          try {
            const value = await invoke('plugin.invoke', { method: 'archive.list', params: { path, password: passwordValue || undefined } })
            if (value.supported === false) {
              content.innerHTML = ''
              const p = document.createElement('p'); p.className = 'hint'; p.textContent = value.message || '暂不支持预览此格式'; content.append(p)
              extract.disabled = false
              return
            }
            passwordRow.hidden = !value.encrypted
            allEntries = value.entries || []
            expanded.clear()
            summary.textContent = `${allEntries.length} 项${value.encrypted ? ' · 加密' : ''}`
            render()
            extract.disabled = false
          } catch (error) {
            const message = String(error?.message || error)
            if (message.includes('需要密码') || message.toLowerCase().includes('password')) {
              passwordRow.hidden = false
              content.innerHTML = '<p class="hint">这个压缩包需要密码。</p>'
              return
            }
            fail(error)
          }
        }

        const start = async () => {
          try {
            setToken((await invoke('theme.get')).tokens)
            const context = await invoke('context.get')
            if (Number.isFinite(context.uiTimeoutMs) && context.uiTimeoutMs > 0)
              requestTimeoutMs = context.uiTimeoutMs
            path = context.resource?.metadata?.name || context.preview?.name || ''
            if (!path) return fail(new Error('没有文件上下文'))
            await load()
          } catch (error) { fail(error) }
        }

        unlock.addEventListener('click', () => { passwordValue = password.value; void load() })
        password.addEventListener('keydown', (event) => { if (event.key === 'Enter') { passwordValue = password.value; void load() } })
        // archive.extract starts a Core-owned task. Poll the task instead of
        // rendering the {taskId} payload as an extraction path.
        const waitForTask = async (taskId) => {
          while (true) {
            const task = await invoke('plugin.task', { taskId })
            if (!task) throw new Error('状态中心没有找到该任务')
            if (task.status === 'completed') return task.result
            if (task.status === 'failed') throw new Error(task.error || '解压失败')
            if (task.status === 'cancelled') throw new Error('已取消')
            await new Promise((resolve) => setTimeout(resolve, 300))
          }
        }

        extract.addEventListener('click', async () => {
          extract.disabled = true
          setStatus('正在解压…')
          try {
            const started = await invoke('plugin.invoke', { method: 'archive.extract', params: { path, password: passwordValue || undefined } })
            const destination = typeof started === 'string' ? started : await waitForTask(started?.taskId)
            setStatus(`已解压到 ${destination}`)
          } catch (error) { setStatus(''); fail(error) }
          finally { extract.disabled = false }
        })

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return
          const data = event.data
          if (!data || data.type !== 'fiex.bridge.init' || event.ports.length !== 1) return
          port = event.ports[0]
          sessionId = data.sessionId
          nonce = data.nonce
          port.onmessage = (message) => {
            const payload = message.data
            if (payload?.type === 'response' && payload.requestId) {
              const entry = pending.get(payload.requestId)
              if (!entry) return
              pending.delete(payload.requestId)
              clearTimeout(entry.timer)
              if (payload.error) entry.reject(new Error(payload.error.message || '请求失败'))
              else entry.resolve(payload.result)
              return
            }
            if (payload?.type === 'event' && payload.name === 'theme.changed') setToken(payload.payload?.tokens)
          }
          port.start()
          port.postMessage({ type: 'fiex.bridge.ready', sessionId, nonce, bridgeVersion: '1.0' })
          start()
        })
        window.parent.postMessage({ type: 'fiex.bridge.listening' }, '*')
      })()
    </script>
  </body>
</html>
