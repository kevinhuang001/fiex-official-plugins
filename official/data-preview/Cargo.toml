[package]
name = "fiex-plugin-data-preview"
version = "0.4.1"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[dependencies]
calamine = { version = "0.31", features = ["dates"] }
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
csv = "1.4"
arrow = { version = "60", default-features = false, features = ["ipc"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd"] }
apache-avro = "0.22"
bytes = "1"
