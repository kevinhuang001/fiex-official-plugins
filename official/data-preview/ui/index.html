<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数据预览</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d2430; --muted: #6b7684; --surface: #fff; --canvas: #f6f7f9;
        --hover: rgba(20, 30, 45, 0.06); --line: rgba(20, 30, 45, 0.12);
        --accent: #2f6fed; --danger: #b4443d;
        font: 12px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: flex; color: var(--text); background: var(--surface); overflow: hidden; }
      aside { width: 190px; flex: 0 0 auto; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--canvas); min-height: 0; }
      .search { padding: 8px; border-bottom: 1px solid var(--line); }
      .search input { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; outline: none; }
      .search input:focus { border-color: var(--accent); }
      .datasets { flex: 1; overflow: auto; padding: 4px; }
      .dataset { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 7px; border: 0; border-radius: 5px; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
      .dataset:hover { background: var(--hover); }
      .dataset[aria-selected="true"] { background: var(--hover); color: var(--accent); font-weight: 600; }
      .dataset span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge { flex: 0 0 auto; padding: 0 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); font-size: 9px; font-weight: 500; text-transform: uppercase; }
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); min-height: 38px; }
      .head strong { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .head .muted { color: var(--muted); }
      .tabs { display: flex; gap: 2px; margin-left: auto; }
      .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; padding: 4px 9px; border-radius: 5px; cursor: pointer; }
      .tabs button[aria-selected="true"] { background: var(--hover); color: var(--text); font-weight: 600; }
      .grid-host { flex: 1; overflow: auto; min-height: 0; }
      table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 11px; }
      th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
      thead th { position: sticky; top: 0; z-index: 1; background: var(--canvas); font-weight: 600; cursor: pointer; user-select: none; }
      thead th .type { display: block; color: var(--muted); font-weight: 400; font-size: 9px; }
      thead th[data-sort] { color: var(--accent); }
      tbody tr:hover td { background: var(--hover); }
      td.null { color: var(--muted); font-style: italic; }
      td.blob { color: var(--muted); }
      td.number { text-align: right; font-variant-numeric: tabular-nums; }
      .pager { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .pager[hidden] { display: none; }
      .pager button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 5px; padding: 2px 8px; font: inherit; cursor: pointer; }
      .pager button:disabled { opacity: 0.45; cursor: default; }
      .pager select { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 5px; padding: 2px 4px; font: inherit; }
      .pager .grow { flex: 1; }
      .hint { color: var(--muted); padding: 24px; text-align: center; }
      .error { color: var(--danger); white-space: pre-wrap; padding: 16px; }
      .schema { padding: 12px 14px; display: grid; gap: 14px; align-content: start; }
      .schema h3 { margin: 0 0 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
      .schema table { width: 100%; }
      .schema td, .schema th { white-space: normal; max-width: none; }
      .pk { color: var(--accent); font-weight: 600; }
      .empty-side { color: var(--muted); padding: 10px; font-size: 11px; }
      .note { padding: 4px 12px; color: var(--muted); font-size: 10px; border-bottom: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <aside>
      <div class="search"><input id="filter" type="search" placeholder="筛选数据集…" aria-label="筛选数据集" /></div>
      <div class="datasets" id="datasets"><p class="empty-side">正在读取…</p></div>
    </aside>
    <main>
      <div class="head">
        <strong id="title">未选择数据集</strong>
        <span class="muted" id="summary"></span>
        <div class="tabs">
          <button id="data-tab" type="button" aria-selected="true">数据</button>
          <button id="schema-tab" type="button" aria-selected="false">结构</button>
        </div>
      </div>
      <div class="note" id="note" hidden></div>
      <div class="grid-host" id="content"><p class="hint">选择左侧的数据集查看内容。</p></div>
      <div class="pager" id="pager" hidden>
        <button id="prev" type="button">上一页</button>
        <span id="page-info"></span>
        <button id="next" type="button">下一页</button>
        <span class="grow"></span>
        <label>每页
          <select id="page-size">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
        </label>
      </div>
    </main>
    <script>
      (() => {
        const datasetsHost = document.getElementById('datasets')
        const content = document.getElementById('content')
        const title = document.getElementById('title')
        const summary = document.getElementById('summary')
        const pager = document.getElementById('pager')
        const pageInfo = document.getElementById('page-info')
        const prev = document.getElementById('prev')
        const next = document.getElementById('next')
        const pageSize = document.getElementById('page-size')
        const filter = document.getElementById('filter')
        const dataTab = document.getElementById('data-tab')
        const schemaTab = document.getElementById('schema-tab')
        const note = document.getElementById('note')
        let port = null, sessionId = '', nonce = '', seq = 0
        let path = '', format = '', datasets = [], selected = '', tab = 'data'
        let rows = [], columns = [], total = 0, offset = 0, limit = 100, order = null, descending = false
        let current = {}
        const pending = new Map()

        const setToken = (tokens) => {
          for (const [key, value] of Object.entries(tokens || {})) {
            if (key === 'mode' || !value) continue
            document.documentElement.style.setProperty(`--${key}`, value)
          }
        }
        const invoke = (method, params) => new Promise((resolve, reject) => {
          if (!port) return reject(new Error('bridge not ready'))
          const requestId = `data-${++seq}`
          const timer = setTimeout(() => { pending.delete(requestId); reject(new Error('请求超时')) }, 30000)
          pending.set(requestId, { resolve, reject, timer })
          port.postMessage({ type: 'request', bridgeVersion: '1.0', sessionId, requestId, method, params })
        })
        const fail = (error) => {
          content.innerHTML = ''
          const p = document.createElement('p'); p.className = 'error'; p.textContent = String(error?.message || error); content.append(p)
        }

        const renderDatasets = () => {
          const query = filter.value.trim().toLowerCase()
          const visible = datasets.filter((item) => item.name.toLowerCase().includes(query))
          datasetsHost.innerHTML = ''
          if (!visible.length) { datasetsHost.innerHTML = '<p class="empty-side">没有匹配的数据集。</p>'; return }
          for (const item of visible) {
            const button = document.createElement('button')
            button.type = 'button'
            button.className = 'dataset'
            button.setAttribute('aria-selected', String(item.id === selected))
            const badge = document.createElement('span'); badge.className = 'badge'
            badge.textContent = item.kind === 'view' ? 'V' : item.kind === 'sheet' ? 'S' : 'T'
            const label = document.createElement('span'); label.textContent = item.name
            button.append(badge, label)
            button.addEventListener('click', () => select(item.id))
            datasetsHost.append(button)
          }
        }

        const cell = (value, column) => {
          const td = document.createElement('td')
          if (value === null) { td.className = 'null'; td.textContent = 'NULL' }
          else if (typeof value === 'object' && value.blob !== undefined) { td.className = 'blob'; td.textContent = `BLOB (${value.blob} bytes)` }
          else if (typeof value === 'number') { td.className = 'number'; td.textContent = String(value) }
          else { td.textContent = String(value); td.title = String(value) }
          td.dataset.column = column
          return td
        }

        const renderData = () => {
          content.innerHTML = ''
          if (!selected) { content.innerHTML = '<p class="hint">选择左侧的数据集查看内容。</p>'; return }
          if (!rows.length) { content.innerHTML = '<p class="hint">没有数据。</p>'; return }
          const table = document.createElement('table')
          const head = document.createElement('thead')
          const headRow = document.createElement('tr')
          for (const column of columns) {
            const th = document.createElement('th')
            th.textContent = column.name
            const type = document.createElement('span'); type.className = 'type'; type.textContent = column.kind || 'text'
            th.append(type)
            if (order === column.name) th.dataset.sort = descending ? 'desc' : 'asc'
            th.addEventListener('click', () => {
              if (order === column.name) descending = !descending
              else { order = column.name; descending = false }
              void loadPage()
            })
            headRow.append(th)
          }
          head.append(headRow); table.append(head)
          const body = document.createElement('tbody')
          for (const row of rows) {
            const tr = document.createElement('tr')
            row.forEach((value, index) => tr.append(cell(value, columns[index]?.name || '')))
            body.append(tr)
          }
          table.append(body); content.append(table)
        }

        const schemaSections = () => {
          const sections = [{
            title: '字段',
            columns: ['名称', '类型', '非空', '默认值', '主键'],
            rows: columns.map((column) => [
              column.name,
              column.kind || 'text',
              column.notNull === undefined ? '—' : column.notNull ? '是' : '否',
              column.default,
              column.primaryKey,
            ]),
          }]
          if (current.indexes?.length)
            sections.push({
              title: '索引',
              columns: ['名称', '唯一', '来源', '字段'],
              rows: current.indexes.map((index) => [index.name, index.unique ? '是' : '否', index.origin || '', (index.columns || []).join(', ')]),
            })
          if (current.foreignKeys?.length)
            sections.push({
              title: '外键',
              columns: ['字段', '引用表', '引用字段'],
              rows: current.foreignKeys.map((key) => [key.from, key.table, key.to || '']),
            })
          return sections
        }

        const renderSchema = () => {
          content.innerHTML = ''
          const wrap = document.createElement('div'); wrap.className = 'schema'
          for (const entry of schemaSections()) {
            const section = document.createElement('section')
            const heading = document.createElement('h3'); heading.textContent = entry.title
            const table = document.createElement('table')
            const head = document.createElement('thead')
            const headRow = document.createElement('tr')
            for (const name of entry.columns) { const th = document.createElement('th'); th.textContent = name; headRow.append(th) }
            head.append(headRow); table.append(head)
            const body = document.createElement('tbody')
            for (const row of entry.rows) {
              const tr = document.createElement('tr')
              for (const value of row) {
                const td = document.createElement('td')
                if (value === true) { td.className = 'pk'; td.textContent = '✓' }
                else if (value === false || value === null || value === undefined) td.textContent = '—'
                else td.textContent = String(value)
                tr.append(td)
              }
              body.append(tr)
            }
            table.append(body); section.append(heading, table); wrap.append(section)
          }
          content.append(wrap)
        }

        const paint = () => {
          dataTab.setAttribute('aria-selected', String(tab === 'data'))
          schemaTab.setAttribute('aria-selected', String(tab === 'schema'))
          summary.textContent = selected ? `${total.toLocaleString()} 行 · ${columns.length} 列` : ''
          pager.hidden = tab !== 'data' || !selected
          const pages = Math.max(1, Math.ceil(total / limit))
          pageInfo.textContent = `第 ${Math.floor(offset / limit) + 1} / ${pages} 页`
          prev.disabled = offset <= 0
          next.disabled = offset + limit >= total
          note.hidden = !current.note
          note.textContent = current.note || ''
          if (tab === 'schema') renderSchema()
          else renderData()
        }

        const loadPage = async () => {
          if (!selected) return
          try {
            const value = await invoke('plugin.invoke', { method: 'data.page', params: { path, dataset: selected, limit, offset, order, descending } })
            current = value || {}
            columns = current.columns || []
            rows = current.rows || []
            total = current.total || 0
            title.textContent = selected
            paint()
          } catch (error) { fail(error) }
        }

        const select = (id) => {
          selected = id; offset = 0; order = null; descending = false
          title.textContent = id
          renderDatasets()
          void loadPage()
        }

        const start = async () => {
          try {
            setToken((await invoke('theme.get')).tokens)
            const context = await invoke('context.get')
            path = context.preview?.path || ''
            if (!path) return fail(new Error('没有文件上下文'))
            const value = await invoke('plugin.invoke', { method: 'data.open', params: { path } })
            format = value.format || ''
            datasets = value.datasets || []
            renderDatasets()
            if (!datasets.length) { content.innerHTML = '<p class="hint">没有可显示的数据集。</p>'; return }
            selected = datasets[0].id
            title.textContent = selected
            renderDatasets()
            if (value.page) {
              current = value.page || {}
              columns = current.columns || []
              rows = current.rows || []
              total = current.total || 0
              paint()
            } else {
              await loadPage()
            }
          } catch (error) { fail(error) }
        }

        filter.addEventListener('input', renderDatasets)
        dataTab.addEventListener('click', () => { tab = 'data'; paint() })
        schemaTab.addEventListener('click', () => { tab = 'schema'; paint() })
        prev.addEventListener('click', () => { offset = Math.max(0, offset - limit); void loadPage() })
        next.addEventListener('click', () => { offset += limit; void loadPage() })
        pageSize.addEventListener('change', () => { limit = Number(pageSize.value) || 100; offset = 0; void loadPage() })

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return
          const data = event.data
          if (!data || data.type !== 'fiex.bridge.init' || event.ports.length !== 1) return
          port = event.ports[0]; sessionId = data.sessionId; nonce = data.nonce
          port.onmessage = (message) => {
            const payload = message.data
            if (payload?.type === 'response' && payload.requestId) {
              const entry = pending.get(payload.requestId)
              if (!entry) return
              pending.delete(payload.requestId); clearTimeout(entry.timer)
              if (payload.error) entry.reject(new Error(payload.error.message || '请求失败'))
              else entry.resolve(payload.result)
              return
            }
            if (payload?.type === 'event' && payload.name === 'theme.changed') setToken(payload.payload?.tokens)
          }
          port.start()
          port.postMessage({ type: 'fiex.bridge.ready', sessionId, nonce, bridgeVersion: '1.0' })
          start()
        })
        window.parent.postMessage({ type: 'fiex.bridge.listening' }, '*')
      })()
    </script>
  </body>
</html>
