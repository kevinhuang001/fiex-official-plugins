[package]
name = "fiex-plugin-email"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[lib]
name = "fiex_plugin_email"
path = "src/lib.rs"

[[bin]]
name = "fiex-plugin-email"
path = "src/main.rs"

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
imap = { version = "3.0.0-alpha.15", default-features = false }
mail-parser = "0.11"
