[package]
name = "fiex-plugin-everything"
version="0.2.2"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"

[target.'cfg(windows)'.dependencies]
everything-ipc = "0.1.4"

[dev-dependencies]
tempfile = "3"
