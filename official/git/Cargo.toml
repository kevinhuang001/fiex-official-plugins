[package]
name = "fiex-plugin-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
which = "8"
base64 = "0.22"
dirs = "6"
globset = "0.4"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
