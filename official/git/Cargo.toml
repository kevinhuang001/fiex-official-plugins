[package]
name = "fiex-plugin-git"
version="0.2.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
base64 = "0.22"
dirs = "6"
globset = "0.4"
mime_guess = "2"
url = "2"
git2 = { version = "0.21", features = ["https", "ssh", "vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"
