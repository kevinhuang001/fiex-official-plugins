<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office 预览</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d2430;
        --muted: #6b7684;
        --surface: #ffffff;
        --canvas: #f6f7f9;
        --line: rgba(20, 30, 45, 0.12);
        --accent: #2f6fed;
        font: 13px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--text); background: var(--surface); }
      main { padding: 18px 22px 32px; max-width: 860px; margin: 0 auto; }
      .hint { color: var(--muted); text-align: center; padding: 28px 0; }
      .preview-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 300px; color: var(--muted); }
      .preview-loading .spinner { width: 20px; height: 20px; border: 2px solid color-mix(in srgb, var(--accent) 18%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: preview-spin .8s linear infinite; }
      @keyframes preview-spin { to { transform: rotate(360deg); } }
      .error { color: var(--danger, #b4443d); white-space: pre-wrap; }
      h1, h2, h3, h4 { line-height: 1.35; margin: 0.9em 0 0.45em; font-weight: 600; }
      h1 { font-size: 20px; }
      h2 { font-size: 16px; }
      h3 { font-size: 14px; }
      p { margin: 0 0 0.7em; }
      ul, ol { margin: 0 0 0.9em; padding-left: 1.4em; }
      li { margin: 0.15em 0; }
      table { border-collapse: collapse; margin: 0 0 1.1em; font-size: 12px; min-width: 60%; }
      th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
      th { background: var(--canvas); font-weight: 600; }
      td p, th p { margin: 0; }
      img { max-width: 100%; height: auto; }
      hr {
        border: 0; height: 1px; margin: 22px 0;
        background: var(--line);
      }
      .document { overflow-wrap: anywhere; }
      .page-limit { margin: 22px 0 0; color: var(--muted); text-align: center; font-size: 11px; }
    </style>
  </head>
  <body>
    <main id="content"><div class="preview-loading"><span class="spinner" aria-hidden="true"></span><span>正在解析文档…</span></div></main>
    <script>
      (() => {
        const content = document.getElementById('content')
        let port = null
        let sessionId = ''
        let nonce = ''
        let seq = 0
        const pending = new Map()

        const setToken = (tokens) => {
          for (const [key, value] of Object.entries(tokens || {})) {
            if (key === 'mode' || !value) continue
            document.documentElement.style.setProperty(`--${key}`, value)
          }
        }
        const invoke = (method, params) =>
          new Promise((resolve, reject) => {
            if (!port) return reject(new Error('bridge not ready'))
            const requestId = `office-${++seq}`
            const timer = setTimeout(() => {
              pending.delete(requestId)
              reject(new Error('请求超时'))
            }, 20000)
            pending.set(requestId, { resolve, reject, timer })
            port.postMessage({ type: 'request', bridgeVersion: '1.0', sessionId, requestId, method, params })
          })

        let readySent = false
        const ready = () => { if (readySent) return; readySent = true; void invoke('preview.ready').catch(() => {}) }
        const fail = (error) => {
          content.innerHTML = ''
          const line = document.createElement('p')
          line.className = 'error'
          line.textContent = String(error?.message || error)
          content.append(line)
          ready()
        }

        const start = async () => {
          try {
            setToken((await invoke('theme.get')).tokens)
            const context = await invoke('context.get')
            const name =
              context.resource?.metadata?.name || context.preview?.name || ''
            if (!name) throw new Error('没有文件上下文')
            const value = await invoke('plugin.invoke', {
              method: 'office.render',
              params: { path: name },
            })
            if (!value.html) {
              content.innerHTML = '<p class="hint">文档没有可提取的内容。</p>'
              return
            }
            const documentView = document.createElement('div')
            documentView.className = 'document'
            // The plugin sanitizes this HTML on the Rust side before it arrives.
            documentView.innerHTML = value.html
            content.replaceChildren(documentView)
            if (value.truncated) {
              const note = document.createElement('p')
              note.className = 'page-limit'
              note.textContent = `仅显示前 ${value.pages} 页`
              content.append(note)
            }
            ready()
          } catch (error) {
            fail(error)
          }
        }

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return
          const data = event.data
          if (!data || data.type !== 'fiex.bridge.init' || event.ports.length !== 1) return
          port = event.ports[0]
          sessionId = data.sessionId
          nonce = data.nonce
          port.onmessage = (message) => {
            const payload = message.data
            if (payload?.type === 'response' && payload.requestId) {
              const entry = pending.get(payload.requestId)
              if (!entry) return
              pending.delete(payload.requestId)
              clearTimeout(entry.timer)
              if (payload.error) entry.reject(new Error(payload.error.message || '请求失败'))
              else entry.resolve(payload.result)
              return
            }
            if (payload?.type === 'event' && payload.name === 'theme.changed')
              setToken(payload.payload?.tokens)
          }
          port.start()
          port.postMessage({ type: 'fiex.bridge.ready', sessionId, nonce, bridgeVersion: '1.0' })
          start()
        })
        const announce = () =>
          window.parent.postMessage({ type: 'fiex.bridge.listening' }, '*')
        announce()
        // A srcDoc iframe can execute this script before the host has attached
        // its message listener. Keep announcing until the host answers.
        const announceTimer = setInterval(() => {
          if (port) {
            clearInterval(announceTimer)
            return
          }
          announce()
        }, 250)
      })()
    </script>
  </body>
</html>
