[package]
name = "fiex-plugin-smb"
version="0.2.8"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt","time"] }
smb = { version = "0.12", default-features = false, features = ["single_threaded", "sign", "encrypt"] }
sspi = { version = "=0.21.3", default-features = false }
futures-util = "0.3"
base64 = "0.22"
