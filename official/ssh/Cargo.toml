[package]
name = "fiex-plugin-ssh"
version = "0.2.1"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust", features = ["tokio"] }
serde_json = "1"
russh = "0.64"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
