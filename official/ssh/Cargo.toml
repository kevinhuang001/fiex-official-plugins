[package]
name = "fiex-plugin-ssh"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
fiex-plugin-sdk = { path = "../../sdk/rust" }
serde_json = "1"
russh = "0.64"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io-util"] }
base64 = "0.22"
